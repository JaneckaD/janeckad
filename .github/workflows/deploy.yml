# Po každém nahrání změn do hlavní větve se web sestaví a nasadí na GitHub Pages.
name: Nasazení webu

on:
  push:
    branches: [claude/personal-website-b5uqoc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Seznamu, Bingu a dalším vyhledávačům dá vědět, že se web změnil (IndexNow).
      # Když se to nepovede, nasazení tím neselže.
      - name: Oznámit změny vyhledávačům
        continue-on-error: true
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"davix.cz","key":"a651d08b062b27f2a9fd1d3913ffba04","keyLocation":"https://davix.cz/a651d08b062b27f2a9fd1d3913ffba04.txt","urlList":["https://davix.cz/","https://davix.cz/portfolio/"]}'
