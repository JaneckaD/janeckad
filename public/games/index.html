<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<!-- skrytá stránka: nikam se na ni neodkazuje a vyhledávače ji nemají indexovat -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Hry pro dva</title>
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Hry pro dva" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="ikona-192.png" type="image/png" />
<link rel="apple-touch-icon" href="ikona-180.png" />
<style>
@font-face { font-family: 'Rethink Sans'; font-weight: 400 800; font-display: swap; src: url(rethink-sans-latin-wght-normal.woff2) format('woff2'); }
@font-face { font-family: 'Rethink Sans'; font-weight: 400 800; font-display: swap; src: url(rethink-sans-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
:root {
  --bg: #0f172a; --bg-2: #162036; --card: #1b2640; --line: rgba(255,255,255,.1); --ink: #f1f5fb; --ink-2: #b9c1cf; --ink-3: #8a93a6;
  --p1: #3b82f6; --p1-soft: rgba(59,130,246,.18); --p2: #f97316; --p2-soft: rgba(249,115,22,.18); --ok: #22c55e;
  --r: 20px; --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { font: 400 16px/1.5 'Rethink Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input { font: inherit; }
.wrap { width: min(760px, 100% - 32px); margin-inline: auto; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* hlavička */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 22px) 0 10px; }
.brand { font: 700 20px/1 'Rethink Sans'; letter-spacing: -.035em; }
.brand i { font-style: normal; color: var(--p1); }
.lang { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg-2); }
.lang button { font: 600 12px/1 'Rethink Sans'; letter-spacing: .04em; color: var(--ink-3); border-radius: 999px; padding: 8px 11px; }
.lang button[aria-pressed="true"] { background: var(--p1); color: #fff; }

/* úvod */
.hero { padding: 22px 0 18px; position: relative; }
.hero h1 { font: 400 clamp(38px, 10vw, 60px)/1 'Rethink Sans'; letter-spacing: -.045em; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin-top: 12px; color: var(--ink-2); max-width: 520px; }
.names { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 20px; }
.names label { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); }
.names label:first-child { box-shadow: inset 3px 0 0 var(--p1); }
.names label:last-child { box-shadow: inset 3px 0 0 var(--p2); }
.names input { width: 100%; min-width: 0; background: none; border: 0; color: var(--ink); padding: 8px 4px; outline: none; font-weight: 600; user-select: text; -webkit-user-select: text; }
.names .vs { font-weight: 700; color: var(--ink-3); font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot.p1 { background: var(--p1); } .dot.p2 { background: var(--p2); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 14px 0 22px; }
.gcard { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); transition: transform .3s var(--ease); position: relative; overflow: hidden; }
.gcard:active { transform: scale(.97); }
.gcard .emo { font-size: 30px; line-height: 1; margin-bottom: 6px; }
.gcard b { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.gcard small { font-size: 13px; color: var(--ink-3); line-height: 1.35; }
.gcard.is-feat { grid-column: 1 / -1; background: linear-gradient(120deg, rgba(59,130,246,.28), rgba(249,115,22,.18)); }
.tip { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
.tip .i { color: var(--p1); margin-top: 1px; }

/* obrazovka hry */
.game { display: none; min-height: 100%; flex-direction: column; }
body.in-game .home { display: none; }
body.in-game .game { display: flex; }
.ghead { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 10px; }
.back { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); border: 1px solid var(--line); }
.ghead h2 { flex: 1; font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
.info { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); border: 1px solid var(--line); }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); }
.score div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.score div:last-child { justify-content: flex-end; }
.score span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 15px; }
.score b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score em { font-style: normal; color: var(--ink-3); font-size: 13px; }
.score .on { position: relative; }
.score .on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 3px; border-radius: 3px; background: currentColor; }
.rules { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--bg-2); color: var(--ink-2); font-size: 14px; display: none; }
.rules.is-open { display: block; }
.status { text-align: center; font-weight: 600; font-size: 18px; letter-spacing: -.02em; padding: 14px 0 10px; min-height: 52px; }
.status .p1 { color: var(--p1); } .status .p2 { color: var(--p2); }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; background: var(--p1); color: #fff; font-weight: 600; transition: transform .2s var(--ease), opacity .2s; }
.btn:active { transform: scale(.97); }
.btn--ghost { background: var(--bg-2); border: 1px solid var(--line); color: var(--ink); }
.btn--p2 { background: var(--p2); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }

/* deska (piškvorky, 4 v řadě, …) */
.board { display: grid; gap: 6px; width: min(100%, 420px); }
.cell { aspect-ratio: 1; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 40px; font-weight: 700; line-height: 1; }
.cell.x { color: var(--p1); } .cell.o { color: var(--p2); }
.cell.win { background: rgba(34,197,94,.22); border-color: var(--ok); }
.board.small { gap: 2px; }
.board.small .cell { border-radius: 5px; font-size: clamp(12px, 4.2vw, 22px); }
.cell .stone { width: 72%; height: 72%; border-radius: 50%; }
.stone.p1 { background: var(--p1); } .stone.p2 { background: var(--p2); }
.c4 { background: #1e3a8a; padding: 8px; border-radius: 18px; gap: 6px; width: min(100%, 440px); }
.c4 .cell { background: var(--bg); border: 0; border-radius: 50%; }
.c4 .cell .stone { width: 100%; height: 100%; animation: drop .35s var(--ease); }
.c4 .cell.win .stone { box-shadow: 0 0 0 4px #fff inset; }
@keyframes drop { from { transform: translateY(-260%); } to { transform: none; } }
.pop { animation: pop .25s var(--ease); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* tečky a čtverečky */
.dots { display: grid; width: min(100%, 400px); aspect-ratio: 1; }
.dots .d { background: var(--ink-2); border-radius: 50%; width: 12px; height: 12px; place-self: center; }
.dots .h, .dots .v { position: relative; }
.dots .h::before, .dots .v::before { content: ''; position: absolute; border-radius: 4px; background: rgba(255,255,255,.08); }
.dots .h::before { left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; }
.dots .v::before { top: 0; bottom: 0; left: 50%; width: 6px; margin-left: -3px; }
.dots .p1::before { background: var(--p1); } .dots .p2::before { background: var(--p2); }
.dots .b { border-radius: 6px; margin: 4px; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.dots .b.p1 { background: var(--p1-soft); color: var(--p1); } .dots .b.p2 { background: var(--p2-soft); color: var(--p2); }

/* pexeso */
.memo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 420px); }
.card { aspect-ratio: 1; border-radius: 14px; perspective: 600px; }
.card > span { position: relative; display: block; width: 100%; height: 100%; transition: transform .45s var(--ease); transform-style: preserve-3d; }
.card.open > span { transform: rotateY(180deg); }
.card i, .card em { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-style: normal; }
.card i { background: linear-gradient(135deg, #24324f, #1b2640); border: 1px solid var(--line); }
.card i::after { content: '?'; color: var(--ink-3); font-weight: 700; font-size: 22px; }
.card em { transform: rotateY(180deg); background: #fff; font-size: 34px; }
.card.p1 em { box-shadow: 0 0 0 3px var(--p1) inset; } .card.p2 em { box-shadow: 0 0 0 3px var(--p2) inset; }

/* hádej slovo (wordle) */
.wgrid { display: grid; gap: 6px; width: min(100%, 330px); }
.wrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.wrow.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.tile { aspect-ratio: 1; border-radius: 10px; background: var(--bg-2); border: 2px solid var(--line); display: grid; place-items: center; font-size: clamp(24px, 8vw, 32px); font-weight: 700; text-transform: uppercase; }
.tile.full { border-color: var(--ink-3); animation: pop .15s var(--ease); }
.tile.flip { animation: flip .5s var(--ease) both; }
.tile.ok { --c: #16a34a; } .tile.in { --c: #f08c2a; } .tile.no { --c: #3a4559; }
@keyframes flip { 0% { transform: rotateX(0); } 49% { transform: rotateX(90deg); background: var(--bg-2); border-color: var(--ink-3); } 50% { transform: rotateX(90deg); background: var(--c); border-color: var(--c); } 100% { transform: rotateX(0); background: var(--c); border-color: var(--c); } }
.wkeys { width: min(100%, 460px); display: grid; gap: 7px; margin-top: 16px; }
.wkeys > div { display: flex; justify-content: center; gap: 5px; }
.wkeys button { flex: 1; max-width: 42px; height: 52px; border-radius: 8px; background: #475569; font-weight: 700; font-size: 17px; display: grid; place-items: center; transition: background .2s; }
.wkeys button.wide { max-width: 64px; flex: 1.5; }
.wkeys button.ok { background: #16a34a; } .wkeys button.in { background: #f08c2a; } .wkeys button.no { background: #1e2638; color: #6b7487; }
.wsubmit { width: min(100%, 460px); margin-top: 10px; background: #16a34a; text-transform: uppercase; letter-spacing: .04em; }
.gcard .solo { position: absolute; right: 14px; top: 14px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.14); }
.lives { color: var(--ink-3); font-size: 14px; }


.matches { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; width: min(100%, 420px); min-height: 150px; align-content: flex-start; margin: 8px 0; }
.match { width: 9px; height: 64px; border-radius: 4px; background: linear-gradient(#ef4444 0 14px, #e8c48a 14px); transition: transform .35s var(--ease), opacity .35s; }
.match.gone { opacity: 0; transform: translateY(-30px) rotate(25deg); }

/* kámen nůžky papír */
.rps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 420px); }
.rps button { aspect-ratio: 1; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-size: 46px; display: grid; place-items: center; }
.reveal { display: flex; gap: 30px; align-items: center; font-size: 64px; margin: 10px 0; }
.reveal small { display: block; font-size: 14px; text-align: center; color: var(--ink-3); }
.cover { width: min(100%, 420px); padding: 26px 18px; border-radius: 18px; background: var(--bg-2); border: 1px dashed var(--line); text-align: center; color: var(--ink-2); }

/* dělená obrazovka (reakce, přetahovaná, pong, počty) */
.split { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-rows: 1fr 1fr; background: var(--bg); touch-action: none; }
.half { position: relative; display: grid; place-items: center; text-align: center; padding: 16px; overflow: hidden; transition: background .15s; }
.half.top { transform: rotate(180deg); background: var(--p2-soft); padding-bottom: calc(env(safe-area-inset-top, 0px) + 48px); }
.half.bot { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px); }
.half.top .pts { bottom: calc(env(safe-area-inset-top, 0px) + 22px) !important; }
.half.bot .pts { bottom: calc(env(safe-area-inset-bottom, 0px) + 22px) !important; }
.half { padding-left: calc(env(safe-area-inset-left, 0px) + 16px); padding-right: calc(env(safe-area-inset-right, 0px) + 16px); }
.half.bot { background: var(--p1-soft); }
.half h3 { font-size: clamp(22px, 6vw, 32px); font-weight: 600; letter-spacing: -.03em; }
.half p { color: var(--ink-2); margin-top: 6px; }
.half > div { width: 100%; display: flex; flex-direction: column; align-items: center; }
.half .big { font-size: clamp(40px, 13vw, 76px); font-weight: 700; letter-spacing: -.04em; }
.half .pts { position: absolute; left: 16px; bottom: 14px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.half.go { background: rgba(34,197,94,.35); }
.half.bad { background: rgba(239,68,68,.3); }
.split .mid { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); }
.split .exit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--line); display: grid; place-items: center; }
.rope { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; z-index: 1; }
.rope i { position: absolute; left: 50%; top: -22px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.15); transition: transform .12s linear; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; width: min(100%, 360px); }
.answers button { height: 64px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 24px; font-weight: 700; }
.answers button.ok { background: rgba(34,197,94,.35); border-color: var(--ok); }
.answers button.bad { background: rgba(239,68,68,.3); }
.answers.locked button { opacity: .4; }
canvas.pong { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; touch-action: none; background: var(--bg); }
.overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(15,23,42,.75); }
.overlay > div { text-align: center; padding: 24px; }
.overlay h3 { font-size: 28px; font-weight: 600; letter-spacing: -.03em; margin-bottom: 14px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } .gcard.is-feat { grid-column: span 3; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="home">
  <div class="wrap">
    <div class="top">
      <span class="brand">david janečka<i>.</i></span>
      <div class="lang" id="lang" role="group" aria-label="Jazyk / Language / Nyelv">
        <button type="button" data-lang="cs" lang="cs">CZ</button><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="hu" lang="hu">HU</button>
      </div>
    </div>
    <div class="hero">
      <h1 data-t="h1"></h1>
      <p data-t="sub"></p>
      <div class="names">
        <label><span class="dot p1"></span><input id="n1" maxlength="14" autocomplete="off" /></label>
        <span class="vs">VS</span>
        <label><span class="dot p2"></span><input id="n2" maxlength="14" autocomplete="off" /></label>
      </div>
    </div>
    <div class="grid" id="list"></div>
    <div class="tip"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span data-t="install"></span></div>
  </div>
</div>

<div class="game">
  <div class="wrap" style="display:flex;flex-direction:column;flex:1">
    <div class="ghead">
      <button class="back" id="back" type="button"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <h2 id="gtitle"></h2>
      <button class="info" id="info" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    </div>
    <div class="score" id="score"></div>
    <div class="rules" id="rules"></div>
    <div class="status" id="status"></div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script>
/* =====================================================================
   HRY PRO DVA – skrytá stránka /games
   Funguje offline (sw.js) a jde přidat na plochu (manifest.webmanifest).
   Texty jsou ve třech jazycích: cs, en, hu (objekt T a slova WORDS).
   ===================================================================== */
const T = {
  cs: {
    title: 'Hry pro dva', h1: 'Hry <em>pro dva</em>',
    sub: 'Jeden mobil, dva hráči. Napište si jména, vyberte hru a hrajte. Funguje i bez internetu.',
    p1: 'Hráč 1', p2: 'Hráč 2',
    install: 'Na plochu: v Safari dejte Sdílet → Přidat na plochu, v Chromu ⋮ → Přidat na plochu. Hry pak fungují i offline.',
    turn: (n) => `Na tahu: ${n}`, wins: (n) => `Vyhrává ${n}!`, draw: 'Remíza', again: 'Hrát znovu', next: 'Další kolo', start: 'Start', exit: 'Konec',
    tapStart: 'Klepněte, až budete oba připraveni', ready: 'Připravit…', tooSoon: 'Moc brzo!', first: 'Rychlejší!', firstTo: (n) => `Hraje se do ${n} bodů`,
    games: {
      word: ['Hádej slovo', 'Sólo: uhodni slovo na 6 pokusů.', 'Hra pro jednoho. Uhodni tajné slovo o 5 písmenech na 6 pokusů. Po každém pokusu se písmena obarví: zelená = písmeno je ve slově na správném místě, oranžová = písmeno ve slově je, ale jinde, tmavá = písmeno ve slově není. Háčky a čárky se nepíšou (Š napiš jako S). Slova se mění podle zvoleného jazyka.'],
      ttt: ['Piškvorky 3×3', 'Klasika: tři v řadě.', 'Střídáte se v kreslení křížků a koleček. Kdo první udělá tři v řadě (vodorovně, svisle nebo šikmo), vyhrává. Začínající hráč se každé kolo střídá.'],
      five: ['Pět v řadě', 'Velké piškvorky na ploše 12×12.', 'Jako piškvorky, ale na větší ploše a vyhrává až pět v řadě.'],
      c4: ['Čtyři v řadě', 'Házejte kameny do sloupců.', 'Klepnutím do sloupce do něj spadne váš kámen. Kdo první spojí čtyři své kameny vodorovně, svisle nebo šikmo, vyhrává.'],
      dots: ['Tečky a čtverečky', 'Uzavírejte čtverečky.', 'Střídavě spojujete dvě sousední tečky čárou. Kdo dokreslí čtvrtou stranu čtverečku, získá ho a hraje znovu. Vyhrává ten, kdo má víc čtverečků.'],

const $ = (s, el = document) => el.querySelector(s);

const LANGS = ['cs', 'en', 'hu'];

if (!LANGS.includes(lang)) lang = store.get('lang', 'cs');
if (!LANGS.includes(lang)) lang = 'cs';
const t = () => T[lang];
let names = store.get('names', ['', '']);
const nm = (i) => (names[i] || '').trim() || t()['p' + (i + 1)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const who = (i) => `<span class="p${i + 1}">${esc(nm(i))}</span>`;
const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = (ms = 15) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

function renderHome() {
  document.documentElement.lang = lang;
  document.title = t().title;
  document.querySelectorAll('[data-t]').forEach((el) => (el.innerHTML = t()[el.dataset.t]));
  document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#n1').placeholder = t().p1; $('#n2').placeholder = t().p2;
  $('#n1').value = names[0] || ''; $('#n2').value = names[1] || '';
  $('#list').innerHTML = GAMES.map((g) => { const [n, d] = t().games[g.id]; return `<button class="gcard${g.feat ? ' is-feat' : ''}" data-game="${g.id}"><span class="emo">${g.emo}</span>${g.solo ? `<span class="solo">${t().word.solo}</span>` : ''}<b>${n}</b><small>${d}</small></button>`; }).join('');
}
$('#lang').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.lang; store.set('lang', lang); renderHome(); if (cur) openGame(cur.id, true); });
['n1', 'n2'].forEach((id, i) => $('#' + id).addEventListener('input', (e) => { names[i] = e.target.value; store.set('names', names); }));
$('#list').addEventListener('click', (e) => { const b = e.target.closest('[data-game]'); if (b) openGame(b.dataset.game); });

/* ---------- obrazovka hry ---------- */
let cur = null; // { id, cleanup, score }
const scores = {};
function setScore(turn) {
  const s = scores[cur.id];
  $('#score').innerHTML = `<div><span class="dot p1"></span><span class="${turn === 0 ? 'on' : ''}" style="color:var(--p1)">${esc(nm(0))}</span></div><div><b>${s[0]}</b> <em>:</em> <b>${s[1]}</b></div><div><span class="${turn === 1 ? 'on' : ''}" style="color:var(--p2)">${esc(nm(1))}</span><span class="dot p2"></span></div>`;
}
const status = (html) => ($('#status').innerHTML = html);
function point(i, turn) { if (i === 0 || i === 1) scores[cur.id][i]++; setScore(turn); }

function openGame(id, keep) {
  if (cur && cur.cleanup) cur.cleanup();
  scores[id] = scores[id] || [0, 0];
  cur = { id };
  document.body.classList.add('in-game');
  const [n, , rules] = t().games[id];
  $('#gtitle').textContent = n;
  $('#rules').textContent = rules;
  $('#rules').classList.toggle('is-open', !keep && !store.get('seen-' + id, false));
  store.set('seen-' + id, true);
  $('#stage').innerHTML = ''; status('');
  $('#score').hidden = !!GAMES.find((g) => g.id === id).solo;
  setScore();
  if (!keep) { history.pushState({ g: id }, ''); scrollTo(0, 0); }
  cur.cleanup = GAME[id]($('#stage')) || null;

        for (const p of [0, 1]) {
          const px = pad[p] * W, hit = p === 0 ? ball.vy > 0 && ball.y + r >= py[0] - 7 && ball.y < py[0] + 8 : ball.vy < 0 && ball.y - r <= py[1] + 7 && ball.y > py[1] - 8;
          if (hit && Math.abs(ball.x - px) < pw / 2 + r) { const off = (ball.x - px) / (pw / 2); const sp = Math.hypot(ball.vx, ball.vy) * 1.05; const a = off * 1.0; ball.vx = Math.sin(a) * sp; ball.vy = Math.cos(a) * sp * (p === 0 ? -1 : 1); buzz(10); }
        }
        if (ball.y > H + r || ball.y < -r) {
          const scorer = ball.y > H ? 1 : 0; pts[scorer]++; buzz(60);
          if (pts[scorer] >= TO) { point(scorer); running = false; msg = '🏆 ' + t().wins(nm(scorer)); pts = [0, 0]; ball = null; }
          else serve(scorer === 0 ? 1 : -1);
        }
      }
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(249,115,22,.08)'; ctx.fillRect(0, 0, W, H / 2); ctx.fillStyle = 'rgba(59,130,246,.08)'; ctx.fillRect(0, H / 2, W, H / 2);
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([8, 10]); ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '700 48px Rethink Sans, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.fillText(pts[0], W / 2, H / 2 + 64);
      ctx.save(); ctx.translate(W / 2, H / 2 - 64); ctx.rotate(Math.PI); ctx.fillText(pts[1], 0, 0); ctx.restore();
      [['#3b82f6', 0], ['#f97316', 1]].forEach(([col, p]) => { ctx.fillStyle = col; const x = pad[p] * W - pw / 2; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, py[p] - 7, pw, 14, 7) : ctx.rect(x, py[p] - 7, pw, 14); ctx.fill(); });
      if (ball) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.fill(); }
      if (msg) {
        ctx.font = '600 20px Rethink Sans, sans-serif'; ctx.fillStyle = '#f1f5fb';
        ctx.fillText(msg, W / 2, H * 0.75); ctx.fillStyle = '#8a93a6'; ctx.font = '400 15px Rethink Sans, sans-serif'; ctx.fillText(t().pongTap, W / 2, H * 0.75 + 26);
        ctx.save(); ctx.translate(W / 2, H * 0.25); ctx.rotate(Math.PI); ctx.font = '600 20px Rethink Sans, sans-serif'; ctx.fillStyle = '#f1f5fb'; ctx.fillText(msg, 0, 0); ctx.fillStyle = '#8a93a6'; ctx.font = '400 15px Rethink Sans, sans-serif'; ctx.fillText(t().pongTap, 0, 26); ctx.restore();
      }
      raf = requestAnimationFrame(step);
    }
    size(); addEventListener('resize', size); raf = requestAnimationFrame(step);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); cv.remove(); ex.remove(); };
  },

  /* ---------- dělená obrazovka: počtářský souboj ---------- */
  math(el) {
    const TO = 7; let pts = [0, 0], state = 'idle', q, locked = [false, false], timer;
    const sp = document.createElement('div'); sp.className = 'split';
    sp.innerHTML = `<div class="half top" data-p="1"></div><div class="half bot" data-p="0"></div><span class="mid"></span><button class="exit" aria-label="${t().exit}"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>`;
    document.body.append(sp);
    const H = [sp.querySelector('.bot'), sp.querySelector('.top')];
    const gen = () => {
      const op = rnd(3); let a, b, r, s;
      if (op === 0) { a = 5 + rnd(45); b = 5 + rnd(45); r = a + b; s = '+'; } else if (op === 1) { a = 20 + rnd(60); b = 3 + rnd(a - 3); r = a - b; s = '−'; } else { a = 2 + rnd(9); b = 2 + rnd(9); r = a * b; s = '×'; }
      const opts = new Set([r]); while (opts.size < 3) { const d = (1 + rnd(5)) * (Math.random() < 0.5 ? -1 : 1) * (op === 2 ? (Math.random() < 0.5 ? a : 1) : 1); if (r + d >= 0) opts.add(r + d); }
      return { text: `${a} ${s} ${b}`, r, opts: shuffle([...opts]) };
    };
    const show = () => H.forEach((h, i) => (h.innerHTML = `<div><div class="big">${q.text}</div><div class="answers${locked[i] ? ' locked' : ''}">${q.opts.map((o) => `<button data-v="${o}">${o}</button>`).join('')}</div></div><span class="pts">${esc(nm(i))}: ${pts[i]}</span>`));
    const idle = (msg) => { state = 'idle'; H.forEach((h, i) => (h.innerHTML = `<div><h3>${msg ? msg(i) : t().tapStart}</h3><p>${t().firstTo(TO)}</p></div><span class="pts">${esc(nm(i))}: ${pts[i]}</span>`)); };
    const next = () => { q = gen(); locked = [false, false]; state = 'go'; show(); };
    sp.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.exit')) return;
      const h = e.target.closest('.half'); if (!h) return; const p = +h.dataset.p;
      if (state === 'idle') { next(); return; }
      const b = e.target.closest('[data-v]'); if (state !== 'go' || !b || locked[p]) return;
      if (+b.dataset.v === q.r) {
        state = 'wait'; pts[p]++; b.classList.add('ok'); buzz(40);
        if (pts[p] >= TO) { timer = setTimeout(() => { const W = p; pts = [0, 0]; point(W); idle((i) => (i === W ? '🏆 ' : '') + t().wins(esc(nm(W)))); }, 700); }
        else timer = setTimeout(next, 700);
      } else { locked[p] = true; b.classList.add('bad'); h.querySelector('.answers').classList.add('locked'); buzz(80); if (locked[0] && locked[1]) { state = 'wait'; timer = setTimeout(next, 700); } }
    });
    sp.querySelector('.exit').onclick = () => history.back();
    idle();
    return () => { clearTimeout(timer); sp.remove(); };
  },
};

renderHome();

/* ---------- offline: service worker ---------- */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
