<style>
@font-face { font-family: 'Rethink Sans'; font-weight: 400 800; font-display: swap; src: url(rethink-sans-latin-wght-normal.woff2) format('woff2'); }
@font-face { font-family: 'Rethink Sans'; font-weight: 400 800; font-display: swap; src: url(rethink-sans-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
:root {
  --bg: #f6f8fb; --card: #fff; --ink: #0f172a; --ink-2: #494f5e; --ink-3: #676c79;
  --line: #e2e6ec; --c1: #2563eb; --c2: #0891b2; --soft: #eaf0fd; --warn: #c2410c; --warn-soft: #fff1e6; --ok: #15803d; --ok-soft: #e8f6ee;
  --r: 22px; --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 86px; }
body { font: 400 16px/1.5 'Rethink Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* hlavička */
.hero { position: relative; overflow: hidden; padding: 40px 0 28px; }
.hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
.hero::before { width: 620px; height: 620px; right: -220px; top: -260px; background: radial-gradient(circle, rgba(8,145,178,.16), transparent 62%); }
.hero::after { width: 620px; height: 620px; right: -120px; top: -140px; background: radial-gradient(circle, rgba(37,99,235,.18), transparent 62%); }
.title-row { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; position: relative; z-index: 2; }
.title-row .lang { margin-bottom: 6px; }
.lang { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.lang button { font: 600 13px/1 'Rethink Sans'; letter-spacing: .04em; color: var(--ink-3); background: none; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; transition: background .2s, color .2s; }
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--c1); color: #fff; }
.logo { font: 700 22px/1 'Rethink Sans'; letter-spacing: -.035em; text-decoration: none; }
.logo i { font-style: normal; color: var(--c1); }
.eyebrow { margin-top: 34px; font: 700 12px/1 'Rethink Sans'; letter-spacing: .16em; text-transform: uppercase; color: var(--c1); display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ''; width: 22px; height: 2px; border-radius: 2px; background: currentColor; }
h1 { margin-top: 12px; font: 400 clamp(38px, 7vw, 68px)/1 'Rethink Sans'; letter-spacing: -.045em; position: relative; }
h1 em { font-style: normal; color: var(--c1); }
.sub { margin-top: 14px; color: var(--ink-2); font-size: 17px; max-width: 560px; position: relative; }
.stats { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; position: relative; }
.stat { display: flex; align-items: center; gap: 8px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 14px; color: var(--ink-2); }
.stat b { color: var(--ink); font-weight: 600; }
.stat .i { color: var(--c1); }

/* trasa */
.route { margin-top: 26px; display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; position: relative; }
.route::-webkit-scrollbar { display: none; }
.stop { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0 2px; }
.stop span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); font: 600 14px/1 'Rethink Sans'; transition: transform .25s var(--ease), background .25s, color .25s; }
.stop small { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.stop:hover span, .stop.is-on span { background: var(--c1); color: #fff; border-color: var(--c1); transform: translateY(-2px); }
.stop.is-home span { background: var(--ink); color: #fff; border-color: var(--ink); }
.dash { flex: 1 0 22px; min-width: 22px; height: 0; border-top: 2px dashed #c8d0dc; margin: 0 4px 22px; }

/* teď */
.now { margin-top: 22px; position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 18px 22px; border-radius: var(--r); color: #fff; background: radial-gradient(120% 140% at 85% 20%, #2b4fd8 0, #16245e 55%, #0b1226 100%); box-shadow: 0 24px 40px -28px rgba(15,23,42,.6); }
.now__ico { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
.now__ico .i { width: 22px; height: 22px; }
.now small { display: block; font: 700 11px/1 'Rethink Sans'; letter-spacing: .14em; text-transform: uppercase; color: #93c5fd; margin-bottom: 6px; }
.now strong { font: 500 19px/1.3 'Rethink Sans'; letter-spacing: -.01em; }
.now__cd { font: 600 22px/1 'Rethink Sans'; letter-spacing: -.02em; text-align: right; white-space: nowrap; }
.now__cd em { display: block; font: 400 12px/1.3 'Rethink Sans'; font-style: normal; color: #c3cad6; margin-top: 4px; }

/* lišta dnů */
.days-nav { position: sticky; top: 0; z-index: 20; background: rgba(246,248,251,.94); border-bottom: 1px solid var(--line); }
.days-nav .wrap { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
.days-nav .wrap::-webkit-scrollbar { display: none; }
.dchip { flex-shrink: 0; text-decoration: none; display: flex; flex-direction: column; align-items: center; padding: 7px 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); line-height: 1.15; transition: background .2s, color .2s, border-color .2s; }
.dchip b { font-size: 15px; font-weight: 600; }
.dchip small { font-size: 11px; color: var(--ink-3); }
.dchip.is-today { border-color: var(--c1); }
.dchip.is-on { background: var(--c1); border-color: var(--c1); color: #fff; }
.dchip.is-on small { color: #dbe6ff; }

/* rozložení */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; padding: 26px 0 60px; }
.side { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 16px; }
#map { height: 430px; border-radius: var(--r); border: 1px solid var(--line); background: #eef1f5; z-index: 1; }
.leaflet-container { font-family: 'Rethink Sans', system-ui, sans-serif; }
.pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c1); color: #fff; font: 600 13px/1 'Rethink Sans'; border: 3px solid #fff; box-shadow: 0 6px 14px -4px rgba(15,23,42,.45); transition: transform .25s var(--ease); }
.pin.is-home { background: var(--ink); }
.pin.is-on { transform: scale(1.3); background: var(--c2); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.box h3 { font: 600 15px/1.2 'Rethink Sans'; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.box h3 .i { color: var(--c1); }
.checks { list-style: none; display: flex; flex-direction: column; gap: 9px; }
.checks label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--c1); flex-shrink: 0; }
.checks span { flex: 1; }
.checks em { font-style: normal; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.checks input:checked + span { color: var(--ink-3); text-decoration: line-through; }
.progress { height: 6px; border-radius: 6px; background: var(--line); margin-top: 14px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--c1); border-radius: 6px; transition: width .4s var(--ease); }

/* dny */
.day { position: relative; padding-left: 34px; padding-bottom: 26px; }
.day::before { content: ''; position: absolute; left: 11px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.day:last-child::before { display: none; }
.day__dot { position: absolute; left: 0; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); }
.day.is-today .day__dot { border-color: var(--c1); background: var(--c1); box-shadow: 0 0 0 6px rgba(37,99,235,.15); }
.day.is-past { opacity: .55; }
.day__head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
.day__head h2 { font: 500 26px/1.1 'Rethink Sans'; letter-spacing: -.03em; }
.day__head span { font-size: 14px; color: var(--ink-3); }
.today-tag { font: 700 11px/1 'Rethink Sans'; letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--c1); color: #fff; }
.day__body { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }

.leg { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; cursor: pointer; transition: border-color .2s, box-shadow .25s; }
.leg:hover, .leg.is-on { border-color: #bcd0fb; box-shadow: 0 18px 30px -26px rgba(37,99,235,.7); }
.leg__top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
.leg__top .i { color: var(--c1); }
.badge { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 'Rethink Sans'; padding: 6px 9px; border-radius: 999px; }
.badge--req { background: var(--warn-soft); color: var(--warn); }
.badge--rec { background: var(--soft); color: var(--c1); }
.badge--ok { background: var(--ok-soft); color: var(--ok); }
.leg__route { margin-top: 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.leg__t b { display: block; font: 600 30px/1 'Rethink Sans'; letter-spacing: -.03em; }
.leg__t span { display: block; margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.leg__t:last-child { text-align: right; }
.leg__mid { text-align: center; font-size: 12px; color: var(--ink-3); min-width: 90px; }
.leg__mid i { display: block; height: 2px; margin: 6px 0; background: linear-gradient(90deg, var(--c1), var(--c2)); border-radius: 2px; position: relative; }
.leg__mid i::after { content: ''; position: absolute; right: -2px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--c2); border-right: 0; }
.leg__more { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--ink-2); }
.leg.is-open .leg__more { display: block; }
.leg__more p + p { margin-top: 6px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 'Rethink Sans'; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); text-decoration: none; cursor: pointer; color: var(--ink); }
.btn:hover { border-color: var(--c1); color: var(--c1); }
.btn .i { width: 15px; height: 15px; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); padding: 12px 16px; border-radius: 16px; background: var(--soft); }
.note .i { color: var(--c1); margin-top: 2px; }
.free { font-size: 15px; color: var(--ink-2); padding: 14px 18px; border-radius: var(--r); border: 1px dashed #cdd5e1; display: flex; gap: 10px; align-items: center; }
.free .i { color: var(--c2); }

.stay { border-radius: var(--r); padding: 18px 20px; background: linear-gradient(135deg, #f1f6ff, #eefbfd); border: 1px solid #d6e3fb; display: grid; grid-template-columns: auto 1fr; gap: 14px; }
.stay__ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--c1); }
.stay__ico .i { width: 22px; height: 22px; }
.stay small { font: 700 11px/1 'Rethink Sans'; letter-spacing: .14em; text-transform: uppercase; color: var(--c1); }
.stay h4 { font: 600 18px/1.25 'Rethink Sans'; margin-top: 6px; }
.stay p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.stay.is-missing { background: #fff; border: 1.5px dashed #f2b98f; }
.stay.is-tbd { background: #fff; border: 1.5px dashed #cdd5e1; }
.stay.is-tbd small { color: var(--ink-3); }
.stay.is-tbd .stay__ico { background: var(--bg); color: var(--ink-3); }
.stay__info { margin-top: 8px !important; padding-top: 8px; border-top: 1px dashed #cfdcf5; }
.stay.is-missing small { color: var(--warn); }
.stay.is-missing .stay__ico { background: var(--warn-soft); color: var(--warn); }

footer { padding: 24px 0 40px; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--line); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { display: contents; }
  #map { height: 300px; order: -1; }
  .side .box { order: 1; }
}
@media (max-width: 520px) {
  .leg__t b { font-size: 25px; }
  .leg__mid { min-width: 64px; }
  .now { grid-template-columns: auto 1fr; }
  .now__cd { grid-column: 1 / -1; text-align: left; }
  .day { padding-left: 28px; }
  .day__head h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>

let lang = new URLSearchParams(location.search).get('lang');
if (!LANGS.includes(lang)) { try { lang = localStorage.getItem('trip-lang'); } catch (e) {} }
if (!LANGS.includes(lang)) lang = 'cs';
const t = () => T[lang];
const C = (id) => CITIES[id][lang];

const TZ = 'Europe/Prague';
const $ = (s, el = document) => el.querySelector(s);
const ico = {

const I = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ico[n]}</svg>`;

// časy: zobrazujeme místní čas podle zóny zapsané u odjezdu/příjezdu
const localTime = (iso) => iso.slice(11, 16);
const dateKey = (iso) => iso.slice(0, 10);
const durText = (a, b) => { const m = Math.round((new Date(b) - new Date(a)) / 60000); return t().dur(Math.floor(m / 60), m % 60); };
const fmtDay = (key) => { const d = new Date(key + 'T12:00:00'); return { num: t().date(d.getDate(), d.getMonth() + 1), name: t().weekdays[d.getDay()] }; };
const addDays = (key, n) => { const d = new Date(key + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mapsUrl = (q) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// „teď“ – pro vyzkoušení jde dát do adresy ?ted=2026-10-27T12:00
const param = new URLSearchParams(location.search).get('ted');
const now = () => (param ? new Date(param + (param.length <= 16 ? ':00+01:00' : '')) : new Date());
const todayKey = () => new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(now());

const FIRST = '2026-10-24', LAST = '2026-11-01';
const DAYS = []; for (let k = FIRST; k <= LAST; k = addDays(k, 1)) DAYS.push(k);
const stayFor = (key) => STAYS.find((s) => key >= s.from && key < s.to);
const nights = (s) => Math.round((new Date(s.to) - new Date(s.from)) / 864e5);
const totalMin = LEGS.reduce((s, l) => s + (new Date(l.arr) - new Date(l.dep)) / 60000, 0);

const ROUTE = [
  { city: 'wien', st: 'wien', home: true }, { city: 'zurich', st: 'zurich' }, { city: 'milan', st: 'milano' }, { city: 'paris', st: 'parisLyon' },
  { city: 'london', st: 'london' }, { city: 'amsterdam', st: 'amsterdam' }, { city: 'berlin', st: 'spandau' }, { city: 'breclav', st: 'breclav', home: true },
];
const cityDay = { wien: '2026-10-24', zurich: '2026-10-24', milan: '2026-10-25', paris: '2026-10-26', london: '2026-10-28', amsterdam: '2026-10-29', berlin: '2026-10-31', breclav: '2026-11-01' };

/* ---------- dny ---------- */
const legsOn = (key) => LEGS.map((l, i) => ({ ...l, i })).filter((l) => dateKey(l.dep) === key);
const resBadge = (l) => (l.res === 'req' ? `<span class="badge badge--req">${t().req}</span>` : `<span class="badge badge--rec">${t().rec}</span>`);

function legHtml(l) {
  const a = STATIONS[l.from], b = STATIONS[l.to];
  return `<article class="leg" data-leg="${l.i}" tabindex="0" aria-expanded="false">
    <div class="leg__top">${I('train')}${t().trainOf(l.i + 1, LEGS.length)}${resBadge(l)}${l.limited ? `<span class="badge badge--req">${t().limited}</span>` : ''}${l.price ? `<span class="badge badge--ok">${I('euro')}${t().price(l.price)}</span>` : ''}</div>
    <div class="leg__route">
      <div class="leg__t"><b>${localTime(l.dep)}</b><span>${a.name}</span></div>
      <div class="leg__mid">${durText(l.dep, l.arr)}<i></i>${l.changes ? t().changes(l.changes) : t().direct}</div>
      <div class="leg__t"><b>${localTime(l.arr)}</b><span>${b.name}</span></div>
    </div>
    <div class="leg__more">
      <p>${t().legText(a.name, localTime(l.dep), b.name, localTime(l.arr))}</p>
      <p>${l.res === 'req' ? t().reqText : t().recText}</p>
      <div class="links"><a class="btn" href="${mapsUrl(a.name)}" target="_blank" rel="noopener">${I('pin')}${a.name}</a><a class="btn" href="${mapsUrl(b.name)}" target="_blank" rel="noopener">${I('pin')}${b.name}</a></div>
    </div>
  </article>`;
}

function stayHtml(s) {
  const span = `${fmtDay(s.from).num} – ${fmtDay(s.to).num}, ${t().nights(nights(s))}`;
  if (s.tbd) {
    return `<div class="stay is-tbd"><div class="stay__ico">${I('bed')}</div><div><small>${t().stay}</small><h4>${C(s.city)}</h4><p>${span}. ${t().tbd}</p></div></div>`;
  }
  if (!s.address) {
    return `<div class="stay is-missing"><div class="stay__ico">${I('bed')}</div><div><small>${t().missing}</small><h4>${C(s.city)}</h4><p>${span}. ${t().missingText}</p></div></div>`;
  }
  const info = s.info && s.info[lang];
  return `<div class="stay"><div class="stay__ico">${I('bed')}</div><div><small>${t().stay}</small><h4>${esc(s.name || C(s.city))}</h4><p>${esc(s.address)}</p><p>${span}</p>${info ? `<p class="stay__info">${esc(info)}</p>` : ''}
    <div class="links"><a class="btn" href="${mapsUrl(s.address)}" target="_blank" rel="noopener">${I('map')}${t().navigate}</a><button class="btn" data-copy="${esc(s.address)}">${I('copy')}${t().copy}</button></div></div></div>`;
}

/* ---------- vykreslení (znovu při změně jazyka) ---------- */
function render() {
  const L = t();
  document.documentElement.lang = lang;
  document.title = L.title;
  document.querySelectorAll('[data-t]').forEach((el) => (el.innerHTML = L[el.dataset.t]));
  document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#route').setAttribute('aria-label', L.routeLabel);
  $('.days-nav').setAttribute('aria-label', L.daysLabel);
  $('#map').setAttribute('aria-label', L.mapLabel);

  $('#stats').innerHTML = [
    [I('calendar'), L.days(DAYS.length)],
    [I('train'), L.trains(LEGS.length)],
    [I('clock'), L.hours(Math.round(totalMin / 60))],
    [I('flag'), L.countries(7)],
  ].map(([i, x]) => `<span class="stat">${i}${x}</span>`).join('');

  $('#route').innerHTML = ROUTE.map((r, i) => `${i ? '<i class="dash"></i>' : ''}<button class="stop${r.home ? ' is-home' : ''}" data-city="${r.city}"><span>${i + 1}</span><small>${C(r.city)}</small></button>`).join('');

  $('#days').innerHTML = DAYS.map((key) => {
    const d = fmtDay(key), ls = legsOn(key), stay = stayFor(key);
    const where = ls.length ? `${C(STATIONS[ls[0].from].city)} → ${C(STATIONS[ls[ls.length - 1].to].city)}` : stay ? C(stay.city) : '';
    let body = ls.map(legHtml).join('');
    if (!ls.length && stay) body += `<div class="free">${I('sun')}${L.dayIn[stay.city]}</div>`;
    if (NOTES[key]) body += `<div class="note">${I('info')}<span>${NOTES[key][lang]}</span></div>`;
    if (stay && stay.from === key) body += stayHtml(stay);
    else if (stay) body += `<div class="free">${I('bed')}${L.same(C(stay.city))}</div>`;
    if (key === LAST) body += `<div class="free">${I('home')}${L.home}</div>`;
    return `<section class="day" id="d${key}" data-day="${key}"><span class="day__dot"></span>
      <div class="day__head"><h2>${d.num} <span style="font-size:inherit;color:var(--ink-3)">${d.name}</span></h2><span>${where}</span></div>
      <div class="day__body">${body}</div></section>`;
  }).join('');

  $('#daysNav').innerHTML = DAYS.map((key) => { const d = fmtDay(key), s = stayFor(key), ls = legsOn(key); return `<a class="dchip${key === curDay ? ' is-on' : ''}" href="#d${key}" data-day="${key}"><b>${d.num}</b><small>${ls.length ? I('train').replace('class="i"', 'class="i" style="width:12px;height:12px;vertical-align:-1px"') : ''} ${s ? C(s.city) : L.homeChip}</small></a>`; }).join('');

  $('#checks').innerHTML = LEGS.map((l, i) => `<li><label><input type="checkbox" data-i="${i}" ${done[i] ? 'checked' : ''}/><span>${C(STATIONS[l.from].city)} → ${C(STATIONS[l.to].city)}</span><em>${l.res === 'req' ? L.must : L.should}</em></label></li>`).join('');

  if (map) Object.entries(pins).forEach(([c, m]) => m.setTooltipContent(C(c)));
  else $('#map').innerHTML = `<p style="padding:20px;color:#676c79">${L.mapFail}</p>`;

  document.querySelectorAll('.day').forEach((d) => io.observe(d));
  renderNow();
}

/* ---------- mapa ---------- */
let map, pins = {}, lines = [];
if (window.L) {
  map = L.map('map', { scrollWheelZoom: false, dragging: !L.Browser.mobile, zoomControl: true, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 18 }).addTo(map);
  ROUTE.forEach((r, i) => {
    const s = STATIONS[r.st];
    const icon = L.divIcon({ className: '', html: `<div class="pin${r.home ? ' is-home' : ''}">${i + 1}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
    pins[r.city] = L.marker([s.lat, s.lng], { icon }).addTo(map).bindTooltip(C(r.city), { direction: 'top', offset: [0, -14] });
    pins[r.city].on('click', () => goDay(cityDay[r.city]));
  });
  LEGS.forEach((l, i) => {
    const a = STATIONS[l.from], b = STATIONS[l.to];
    lines[i] = L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: '#2563eb', weight: 3, opacity: .55, dashArray: '6 8' }).addTo(map);
  });
  map.fitBounds(L.latLngBounds(Object.values(STATIONS).map((s) => [s.lat, s.lng])), { padding: [30, 30] });
}

function focusLeg(i) {
  document.querySelectorAll('.leg').forEach((el) => el.classList.toggle('is-on', +el.dataset.leg === i));
  if (!map) return;
  lines.forEach((ln, j) => ln.setStyle(j === i ? { color: '#0891b2', weight: 5, opacity: 1, dashArray: null } : { color: '#2563eb', weight: 3, opacity: .35, dashArray: '6 8' }));
  map.fitBounds(lines[i].getBounds(), { padding: [50, 50], maxZoom: 7 });
}
function focusCity(city) {
  document.querySelectorAll('.stop').forEach((b) => b.classList.toggle('is-on', b.dataset.city === city));
  Object.entries(pins).forEach(([c, m]) => m.getElement()?.firstElementChild?.classList.toggle('is-on', c === city));
  const st = STATIONS[ROUTE.find((r) => r.city === city).st];
  if (map) { lines.forEach((ln) => ln.setStyle({ color: '#2563eb', weight: 3, opacity: .55, dashArray: '6 8' })); map.flyTo([st.lat, st.lng], 11, { duration: .8 }); }
}
function goDay(key) { document.getElementById('d' + key)?.scrollIntoView({ behavior: 'smooth' }); }

document.addEventListener('click', (e) => {
  const lb = e.target.closest('#lang button');
  if (lb && lb.dataset.lang !== lang) { lang = lb.dataset.lang; try { localStorage.setItem('trip-lang', lang); } catch (er) {} render(); return; }
  const leg = e.target.closest('.leg');
  if (leg && !e.target.closest('a,button')) { const open = leg.classList.toggle('is-open'); leg.setAttribute('aria-expanded', open); focusLeg(+leg.dataset.leg); }
  const stop = e.target.closest('.stop');
  if (stop) { focusCity(stop.dataset.city); goDay(cityDay[stop.dataset.city]); }
  const cp = e.target.closest('[data-copy]');
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(() => { const h = cp.innerHTML; cp.innerHTML = I('copy') + t().copied; setTimeout(() => (cp.innerHTML = h), 1500); }); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList?.contains('leg')) e.target.click(); });

// zvýraznění dne podle toho, kde jsi na stránce
// lišta se dny se posouvá jen do strany, stránku samotnou nikdy nehýbe
let curDay;
const io = new IntersectionObserver((ents) => ents.forEach((en) => {
  if (!en.isIntersecting) return;
  const key = en.target.dataset.day;
  if (key === curDay) return;
  curDay = key;
  document.querySelectorAll('.dchip').forEach((c) => {
    const on = c.dataset.day === key;
    c.classList.toggle('is-on', on);
    if (on) { const w = c.parentElement; w.scrollTo({ left: c.offsetLeft - w.offsetLeft - (w.clientWidth - c.offsetWidth) / 2, behavior: 'smooth' }); }
  });
}), { rootMargin: '-90px 0px -65% 0px' });

/* ---------- rezervace (pamatuje si to tvůj prohlížeč) ---------- */
const KEY = 'trip-rezervace';
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const prog = () => { const n = LEGS.filter((_, i) => done[i]).length; $('#prog').style.width = (n / LEGS.length) * 100 + '%'; };
$('#checks').addEventListener('change', (e) => { done[e.target.dataset.i] = e.target.checked; try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (er) {} prog(); });

/* ---------- teď ---------- */
function cd(ms) { const m = Math.max(0, Math.round(ms / 60000)); return t().cd(Math.floor(m / 1440), Math.floor((m % 1440) / 60), m % 60); }
function renderNow() {
  const L = t(), tm = now(), key = todayKey();
  const next = LEGS.find((l) => new Date(l.dep) > tm);
  const on = LEGS.find((l) => new Date(l.dep) <= tm && new Date(l.arr) > tm);
  let icon = 'clock', label, text, right = '';
  if (tm < new Date(LEGS[0].dep)) { label = L.before; text = L.first(STATIONS.wien.name, localTime(LEGS[0].dep), fmtDay(FIRST).num); right = `${cd(new Date(LEGS[0].dep) - tm)}<em>${L.toDep}</em>`; }
  else if (on) { icon = 'train'; label = L.onTrain; text = L.arrival(C(STATIONS[on.from].city), C(STATIONS[on.to].city), localTime(on.arr)); right = `${cd(new Date(on.arr) - tm)}<em>${L.toArr}</em>`; }
  else if (next) { const s = stayFor(key); icon = 'pin'; label = s ? L.nowIn(C(s.city)) : L.onWay; text = L.next(STATIONS[next.from].name, C(STATIONS[next.to].city), fmtDay(dateKey(next.dep)).num, localTime(next.dep)); right = `${cd(new Date(next.dep) - tm)}<em>${L.toDep}</em>`; }
  else { icon = 'home'; label = L.done; text = L.doneText; }
  $('#now').innerHTML = `<span class="now__ico">${I(icon)}</span><div><small>${label}</small><strong>${text}</strong></div><div class="now__cd">${right}</div>`;
  document.querySelectorAll('.day').forEach((d) => { d.classList.toggle('is-today', d.dataset.day === key); d.classList.toggle('is-past', d.dataset.day < key); });
  document.querySelectorAll('.dchip').forEach((c) => c.classList.toggle('is-today', c.dataset.day === key));
  document.querySelectorAll('.day.is-today .day__head').forEach((h) => { if (!h.querySelector('.today-tag')) h.insertAdjacentHTML('beforeend', `<span class="today-tag">${L.today}</span>`); });
}

render(); prog(); setInterval(renderNow, 30000);
if (DAYS.includes(todayKey())) setTimeout(() => goDay(todayKey()), 300);
</script>
</body>
</html>
