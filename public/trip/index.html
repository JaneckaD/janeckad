:root {

}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 86px; }
body { font: 400 16px/1.5 'Rethink Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }

.logo { font: 700 22px/1 'Rethink Sans'; letter-spacing: -.035em; text-decoration: none; }
.logo i { font-style: normal; color: var(--c1); }

.dash { flex: 1 0 22px; min-width: 22px; height: 0; border-top: 2px dashed #c8d0dc; margin: 0 4px 22px; }

.stay.is-missing small { color: var(--warn); }
.stay.is-missing .stay__ico { background: var(--warn-soft); color: var(--warn); }

footer { padding: 24px 0 40px; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--line); }

@media (max-width: 900px) {

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  map: '<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  euro: '<path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/>',
};
const I = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ico[n]}</svg>`;

// časy: zobrazujeme místní čas podle zóny zapsané u odjezdu/příjezdu
const localTime = (iso) => iso.slice(11, 16);
const dateKey = (iso) => iso.slice(0, 10);
const durText = (a, b) => { const m = Math.round((new Date(b) - new Date(a)) / 60000); return `${Math.floor(m / 60)} h ${m % 60} min`; };
const dayNames = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
const fmtDay = (key) => { const d = new Date(key + 'T12:00:00'); return { num: `${d.getDate()}. ${d.getMonth() + 1}.`, name: dayNames[d.getDay()] }; };
const addDays = (key, n) => { const d = new Date(key + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mapsUrl = (q) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// „teď“ – pro vyzkoušení jde dát do adresy ?ted=2026-10-27T12:00
const param = new URLSearchParams(location.search).get('ted');
const now = () => (param ? new Date(param + (param.length <= 16 ? ':00+01:00' : '')) : new Date());
const todayKey = () => new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(now());

const FIRST = '2026-10-24', LAST = '2026-11-01';
const DAYS = []; for (let k = FIRST; k <= LAST; k = addDays(k, 1)) DAYS.push(k);
const stayFor = (key) => STAYS.find((s) => key >= s.from && key < s.to);
const nights = (s) => Math.round((new Date(s.to) - new Date(s.from)) / 864e5);

/* ---------- přehled nahoře ---------- */
const totalMin = LEGS.reduce((s, l) => s + (new Date(l.arr) - new Date(l.dep)) / 60000, 0);
$('#stats').innerHTML = [
  [I('calendar'), `<b>${DAYS.length}</b> dní`],
  [I('train'), `<b>${LEGS.length}</b> vlaků`],
  [I('clock'), `<b>${Math.round(totalMin / 60)} h</b> ve vlaku`],
  [I('flag'), '<b>7</b> zemí'],
].map(([i, t]) => `<span class="stat">${i}${t}</span>`).join('');

const ROUTE = [
  { city: 'Vídeň', st: 'wien', home: true }, { city: 'Curych', st: 'zurich' }, { city: 'Milán', st: 'milano' }, { city: 'Paříž', st: 'parisLyon' },
  { city: 'Londýn', st: 'london' }, { city: 'Amsterdam', st: 'amsterdam' }, { city: 'Berlín', st: 'spandau' }, { city: 'Břeclav', st: 'breclav', home: true },
];
const cityDay = { 'Vídeň': '2026-10-24', 'Curych': '2026-10-24', 'Milán': '2026-10-25', 'Paříž': '2026-10-26', 'Londýn': '2026-10-28', 'Amsterdam': '2026-10-29', 'Berlín': '2026-10-31', 'Břeclav': '2026-11-01' };
$('#route').innerHTML = ROUTE.map((r, i) => `${i ? '<i class="dash"></i>' : ''}<button class="stop${r.home ? ' is-home' : ''}" data-city="${r.city}"><span>${i + 1}</span><small>${r.city}</small></button>`).join('');

/* ---------- dny ---------- */
const legsOn = (key) => LEGS.map((l, i) => ({ ...l, i })).filter((l) => dateKey(l.dep) === key);
const resBadge = (l) => (l.res === 'req' ? `<span class="badge badge--req">Rezervace povinná</span>` : `<span class="badge badge--rec">Rezervace doporučená</span>`);

function legHtml(l) {
  const a = STATIONS[l.from], b = STATIONS[l.to];
  return `<article class="leg" data-leg="${l.i}" tabindex="0" aria-expanded="false">
    <div class="leg__top">${I('train')}Vlak ${l.i + 1} z ${LEGS.length}${resBadge(l)}${l.limited ? '<span class="badge badge--req">Málo míst</span>' : ''}${l.price ? `<span class="badge badge--ok">${I('euro')}rezervace od ${l.price} €</span>` : ''}</div>
    <div class="leg__route">
      <div class="leg__t"><b>${localTime(l.dep)}</b><span>${a.name}</span></div>
      <div class="leg__mid">${durText(l.dep, l.arr)}<i></i>${l.changes ? `${l.changes} přestup` : 'přímý'}</div>
      <div class="leg__t"><b>${localTime(l.arr)}</b><span>${b.name}</span></div>
    </div>
    <div class="leg__more">
      <p>Odjezd ${a.name} v ${localTime(l.dep)}, příjezd ${b.name} v ${localTime(l.arr)} (místní čas).</p>
      <p>${l.res === 'req' ? 'Bez rezervace místa tě do vlaku nepustí, zarezervuj ji v aplikaci DiscoverEU.' : 'Rezervace není povinná, ale v plném vlaku se hodí.'}</p>
      <div class="links"><a class="btn" href="${mapsUrl(a.name)}" target="_blank" rel="noopener">${I('pin')}${a.name}</a><a class="btn" href="${mapsUrl(b.name)}" target="_blank" rel="noopener">${I('pin')}${b.name}</a></div>
    </div>
  </article>`;
}

function stayHtml(s) {
  const n = nights(s);
  const span = `${fmtDay(s.from).num} – ${fmtDay(s.to).num}, ${n} ${n === 1 ? 'noc' : 'noci'}`;
  if (s.tbd) {
    return `<div class="stay is-tbd"><div class="stay__ico">${I('bed')}</div><div><small>Ubytování</small><h4>${s.city}</h4><p>${span}. Bude upřesněno.</p></div></div>`;
  }
  if (!s.address) {
    return `<div class="stay is-missing"><div class="stay__ico">${I('bed')}</div><div><small>Ubytování · doplnit</small><h4>${s.city}</h4><p>${span}. Adresa zatím chybí.</p></div></div>`;
  }
  return `<div class="stay"><div class="stay__ico">${I('bed')}</div><div><small>Ubytování</small><h4>${esc(s.name || s.city)}</h4><p>${esc(s.address)}</p><p>${span}</p>${s.info ? `<p class="stay__info">${esc(s.info)}</p>` : ''}
    <div class="links"><a class="btn" href="${mapsUrl(s.address)}" target="_blank" rel="noopener">${I('map')}Navigovat</a><button class="btn" data-copy="${esc(s.address)}">${I('copy')}Kopírovat adresu</button></div></div></div>`;
}

$('#days').innerHTML = DAYS.map((key) => {
  const d = fmtDay(key), ls = legsOn(key), stay = stayFor(key), prev = stayFor(addDays(key, -1));
  const where = ls.length ? `${STATIONS[ls[0].from].city} → ${STATIONS[ls[ls.length - 1].to].city}` : stay ? stay.city : '';
  let body = ls.map(legHtml).join('');
  if (!ls.length && stay) body += `<div class="free">${I('sun')}Celý den v ${{ 'Milán': 'Miláně', 'Paříž': 'Paříži', 'Londýn': 'Londýně', 'Amsterdam': 'Amsterdamu', 'Berlín': 'Berlíně' }[stay.city]}.</div>`;
  if (NOTES[key]) body += `<div class="note">${I('info')}<span>${NOTES[key]}</span></div>`;
  if (stay && stay.from === key) body += stayHtml(stay);
  else if (stay) body += `<div class="free">${I('bed')}Spíš pořád ve stejném ubytování (${stay.city}).</div>`;
  if (key === LAST) body += `<div class="free">${I('home')}Návrat domů.</div>`;
  return `<section class="day" id="d${key}" data-day="${key}"><span class="day__dot"></span>
    <div class="day__head"><h2>${d.num} <span style="font-size:inherit;color:var(--ink-3)">${d.name}</span></h2><span>${where}</span></div>
    <div class="day__body">${body}</div></section>`;
}).join('');

$('#daysNav').innerHTML = DAYS.map((key) => { const d = fmtDay(key), s = stayFor(key), ls = legsOn(key); return `<a class="dchip" href="#d${key}" data-day="${key}"><b>${d.num}</b><small>${ls.length ? I('train').replace('class="i"', 'class="i" style="width:12px;height:12px;vertical-align:-1px"') : ''} ${s ? s.city : 'domů'}</small></a>`; }).join('');

/* ---------- mapa ---------- */
let map, pins = {}, lines = [];
if (window.L) {
  map = L.map('map', { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 18 }).addTo(map);
  ROUTE.forEach((r, i) => {
    const s = STATIONS[r.st];
    const icon = L.divIcon({ className: '', html: `<div class="pin${r.home ? ' is-home' : ''}">${i + 1}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
    pins[r.city] = L.marker([s.lat, s.lng], { icon }).addTo(map).bindTooltip(r.city, { direction: 'top', offset: [0, -14] });
    pins[r.city].on('click', () => goDay(cityDay[r.city]));
  });
  LEGS.forEach((l, i) => {
    const a = STATIONS[l.from], b = STATIONS[l.to];
    lines[i] = L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: '#2563eb', weight: 3, opacity: .55, dashArray: '6 8' }).addTo(map);
  });
  map.fitBounds(L.latLngBounds(Object.values(STATIONS).map((s) => [s.lat, s.lng])), { padding: [30, 30] });
} else {
  $('#map').innerHTML = '<p style="padding:20px;color:#676c79">Mapa se nenačetla, zkus obnovit stránku.</p>';
}

function focusLeg(i) {
  document.querySelectorAll('.leg').forEach((el) => el.classList.toggle('is-on', +el.dataset.leg === i));
  if (!map) return;
  lines.forEach((ln, j) => ln.setStyle(j === i ? { color: '#0891b2', weight: 5, opacity: 1, dashArray: null } : { color: '#2563eb', weight: 3, opacity: .35, dashArray: '6 8' }));
  map.fitBounds(lines[i].getBounds(), { padding: [50, 50], maxZoom: 7 });
}
function focusCity(city) {
  document.querySelectorAll('.stop').forEach((b) => b.classList.toggle('is-on', b.dataset.city === city));
  Object.entries(pins).forEach(([c, m]) => m.getElement()?.firstElementChild?.classList.toggle('is-on', c === city));
  const st = STATIONS[ROUTE.find((r) => r.city === city).st];
  if (map) { lines.forEach((ln) => ln.setStyle({ color: '#2563eb', weight: 3, opacity: .55, dashArray: '6 8' })); map.flyTo([st.lat, st.lng], 11, { duration: .8 }); }
}
function goDay(key) { document.getElementById('d' + key)?.scrollIntoView({ behavior: 'smooth' }); }

document.addEventListener('click', (e) => {
  const leg = e.target.closest('.leg');
  if (leg && !e.target.closest('a,button')) { const open = leg.classList.toggle('is-open'); leg.setAttribute('aria-expanded', open); focusLeg(+leg.dataset.leg); }
  const stop = e.target.closest('.stop');
  if (stop) { focusCity(stop.dataset.city); goDay(cityDay[stop.dataset.city]); }
  const cp = e.target.closest('[data-copy]');
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(() => { const t = cp.innerHTML; cp.textContent = 'Zkopírováno'; setTimeout(() => (cp.innerHTML = t), 1500); }); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList?.contains('leg')) e.target.click(); });

// zvýraznění dne podle toho, kde jsi na stránce
const io = new IntersectionObserver((ents) => ents.forEach((en) => {
  if (!en.isIntersecting) return;
  const key = en.target.dataset.day;
  document.querySelectorAll('.dchip').forEach((c) => { const on = c.dataset.day === key; c.classList.toggle('is-on', on); if (on) c.scrollIntoView({ block: 'nearest', inline: 'center' }); });
}), { rootMargin: '-90px 0px -65% 0px' });
document.querySelectorAll('.day').forEach((d) => io.observe(d));

/* ---------- rezervace (pamatuje si to tvůj prohlížeč) ---------- */
const KEY = 'trip-rezervace';
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
$('#checks').innerHTML = LEGS.map((l, i) => `<li><label><input type="checkbox" data-i="${i}" ${done[i] ? 'checked' : ''}/><span>${STATIONS[l.from].city} → ${STATIONS[l.to].city}</span><em>${l.res === 'req' ? 'povinná' : 'doporučená'}</em></label></li>`).join('');
const prog = () => { const n = LEGS.filter((_, i) => done[i]).length; $('#prog').style.width = (n / LEGS.length) * 100 + '%'; };
$('#checks').addEventListener('change', (e) => { done[e.target.dataset.i] = e.target.checked; try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (er) {} prog(); });
prog();

/* ---------- teď ---------- */
function cd(ms) { const m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60; return d ? `${d} d ${h} h` : h ? `${h} h ${mm} min` : `${mm} min`; }
function renderNow() {
  const t = now(), key = todayKey();
  const next = LEGS.find((l) => new Date(l.dep) > t);
  const on = LEGS.find((l) => new Date(l.dep) <= t && new Date(l.arr) > t);
  let icon = 'clock', label, text, right = '';
  if (t < new Date(LEGS[0].dep)) { label = 'Před cestou'; text = `První vlak: ${STATIONS.wien.name} v ${localTime(LEGS[0].dep)}, ${fmtDay(FIRST).num}`; right = `${cd(new Date(LEGS[0].dep) - t)}<em>do odjezdu</em>`; }
  else if (on) { icon = 'train'; label = 'Právě ve vlaku'; text = `${STATIONS[on.from].city} → ${STATIONS[on.to].city}, příjezd ${localTime(on.arr)}`; right = `${cd(new Date(on.arr) - t)}<em>do příjezdu</em>`; }
  else if (next) { const s = stayFor(key); icon = 'pin'; label = s ? `Teď: ${s.city}` : 'Na cestě'; text = `Další vlak: ${STATIONS[next.from].name} → ${STATIONS[next.to].city}, ${fmtDay(dateKey(next.dep)).num} v ${localTime(next.dep)}`; right = `${cd(new Date(next.dep) - t)}<em>do odjezdu</em>`; }
  else { icon = 'home'; label = 'Hotovo'; text = 'Cesta skončila, vítej doma.'; }
  $('#now').innerHTML = `<span class="now__ico">${I(icon)}</span><div><small>${label}</small><strong>${text}</strong></div><div class="now__cd">${right}</div>`;
  document.querySelectorAll('.day').forEach((d) => { d.classList.toggle('is-today', d.dataset.day === key); d.classList.toggle('is-past', d.dataset.day < key); });
  document.querySelectorAll('.dchip').forEach((c) => c.classList.toggle('is-today', c.dataset.day === key));
  document.querySelectorAll('.day.is-today .day__head').forEach((h) => { if (!h.querySelector('.today-tag')) h.insertAdjacentHTML('beforeend', '<span class="today-tag">Dnes</span>'); });
}
renderNow(); setInterval(renderNow, 30000);
if (DAYS.includes(todayKey())) setTimeout(() => goDay(todayKey()), 300);
</script>
</body>
</html>
