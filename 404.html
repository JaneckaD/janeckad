<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena | Davix</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/icon-kurzor.svg?v=3" type="image/svg+xml" />
  <link rel="icon" href="/icon-32.png?v=3" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
</head>
<body>
  <!-- GitHub Pages ukáže tuhle stránku na každé adrese, která neexistuje -->
  <main>
    <section class="page-head page-head--404">
      <div class="hero__blobs" aria-hidden="true">
        <span class="blob blob--a"></span>
        <span class="blob blob--b"></span>
        <span class="blob blob--c"></span>
      </div>
      <div class="page-head__inner">
        <a class="page-head__back" href="/">← Zpět na hlavní stránku</a>
        <h1 class="page-head__title">404</h1>
        <p class="page-head__lead">Tahle stránka tu není. Možná se přesunula, nebo je v odkazu překlep.</p>
        <div class="page-head__cta">
          <a class="btn" href="/">Na hlavní stránku</a>
          <a class="btn btn--ghost" href="/portfolio/">Prohlédnout portfolio</a>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/notfound.js"></script>
</body>
</html>
